name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: the project has no dependencies.
      # `npm test` passes the glob test/*.test.mjs straight to `node --test`, which
      # Node 18/20 do not expand and cmd.exe on Windows does not either, so list the
      # files here and hand node an explicit list.
      - name: Run tests
        shell: bash
        run: |
          node -e "
            const fs = require('fs'), path = require('path'), { spawnSync } = require('child_process');
            const files = fs.readdirSync('test').filter(f => f.endsWith('.test.mjs')).sort().map(f => path.join('test', f));
            if (!files.length) { console.error('no test files found'); process.exit(1); }
            console.log('running', files.length, 'files:', files.join(' '));
            const r = spawnSync(process.execPath, ['--test', ...files], { stdio: 'inherit' });
            process.exit(r.status === null ? 1 : r.status);
          "
